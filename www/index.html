<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سند</title>
<link rel="icon" href="icon.png">
<style>
:root{--bg:#fff;--tx:#1a1a1a;--mu:#6b6b6b;--ac:#004D40;--on:#fff;--sh1:#d3d3d3;--sh2:#fff;--wr:#b3261e}
[data-theme=dark]{--bg:#1a1a1a;--tx:#f2f2f2;--mu:#a0a0a0;--ac:#4db6ac;--on:#06201c;--sh1:#0c0c0c;--sh2:#272727;--wr:#ff8a80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif}
body{min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 100px);max-width:560px;margin:auto}
.raise{box-shadow:6px 6px 14px var(--sh1),-6px -6px 14px var(--sh2);border-radius:20px}
.sink{box-shadow:inset 4px 4px 9px var(--sh1),inset -4px -4px 9px var(--sh2);border-radius:14px}
.card{padding:16px;margin:0 0 18px;background:var(--bg)}
h1{font-size:22px;margin:4px 0 14px}h2{font-size:17px;margin:0 0 12px;color:var(--ac)}
.mu{color:var(--mu);font-size:13px}
.quote{font-size:16px;line-height:1.9;font-weight:600}
button,.btn{font:inherit;color:var(--tx);background:var(--bg);border:0;cursor:pointer;border-radius:14px;padding:10px 16px;box-shadow:4px 4px 10px var(--sh1),-4px -4px 10px var(--sh2)}
button:active{box-shadow:inset 3px 3px 7px var(--sh1),inset -3px -3px 7px var(--sh2)}
.pri{background:var(--ac);color:var(--on);font-weight:700}
.sm{padding:6px 12px;font-size:13px}
input,select,textarea{font:inherit;width:100%;color:var(--tx);background:var(--bg);border:0;padding:12px;margin:6px 0 12px;border-radius:14px;box-shadow:inset 4px 4px 9px var(--sh1),inset -4px -4px 9px var(--sh2);outline:none}
label{font-size:13px;color:var(--mu)}
.bar{height:14px;border-radius:9px;overflow:hidden;margin:8px 0 14px}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .4s}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 4px;border-bottom:1px solid rgba(128,128,128,.15)}
.row:last-child{border:0}.row b{display:block}.done b{text-decoration:line-through;color:var(--mu)}
.chk{width:30px;height:30px;padding:0;flex:none;font-size:15px;color:var(--ac)}
.tag{font-size:11px;padding:2px 8px;border-radius:8px;background:var(--ac);color:var(--on)}
.warn{color:var(--wr);font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--bg);max-width:560px;margin:auto;border-radius:24px 24px 0 0;box-shadow:0 -6px 16px var(--sh1)}
nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;box-shadow:none;padding:6px 18px}
nav button.on{color:var(--ac);font-weight:700;box-shadow:inset 3px 3px 7px var(--sh1),inset -3px -3px 7px var(--sh2)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);left:24px;width:60px;height:60px;border-radius:50%;font-size:32px;padding:0;background:var(--ac);color:var(--on);z-index:5}
.menu{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 164px);left:20px;z-index:5;display:none;flex-direction:column;gap:12px;padding:14px;background:var(--bg)}
.menu.show{display:flex}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--bg);padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 20px);border-radius:26px 26px 0 0}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;max-width:536px;margin:auto;z-index:20;display:flex;flex-direction:column;gap:8px}
.t{padding:14px;background:var(--bg);border-right:5px solid var(--ac);line-height:1.7;font-size:14px}
.t.w{border-color:var(--wr)}
.bat{height:34px;padding:4px;border-radius:12px}.bat i{display:block;height:100%;border-radius:9px;transition:width .5s,background .5s}
.panic{background:#111;color:#fff;border:2px solid #d32f2f;padding:16px;margin:0 0 18px;border-radius:20px;box-shadow:0 0 18px rgba(211,47,47,.5)}
.panic h2{color:#ff5252}.panic .mu{color:#bbb}.panic button{background:#222;color:#fff;box-shadow:none;border:1px solid #444}
.pt{font-size:46px;font-weight:800;text-align:center;letter-spacing:2px;margin:6px 0}body.pm h1{color:#d32f2f}
/* ===== توحيد التصميم ===== */
body{max-width:1000px}nav{max-width:1000px}
.grid{display:grid;grid-template-columns:1fr;gap:16px;align-items:stretch}
@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}
.grid>.card,.grid>.panic{margin:0}.grid>.full{grid-column:1/-1}
.card{padding:18px;border-radius:22px}
h2{display:flex;align-items:center;gap:10px;font-size:17px}
h2 .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block}
.sub{color:var(--mu);font-size:12.5px;margin:-6px 0 12px}
button{min-height:44px}.sm{min-height:34px}.chk{min-height:30px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select,textarea{font-size:16px;min-height:46px}textarea{min-height:80px}
.sheet{box-shadow:0 -8px 30px rgba(0,0,0,.18)}.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--mu);opacity:.35;margin:-6px auto 14px}
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;transition:opacity .5s}
#splash.hide{opacity:0;pointer-events:none}
#splash .lg{width:112px;height:112px;border-radius:28px;object-fit:cover}
#splash b{font-size:28px;color:var(--ac)}#splash p{max-width:360px;line-height:1.9;font-weight:600;margin:0;color:var(--tx)}
/* ===== حركة وسلاسة ===== */
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}@keyframes slide{from{transform:translateY(40px);opacity:.6}}
.enter h1,.enter .grid>*{animation:up .32s ease both}
.enter .grid>*:nth-child(2){animation-delay:.04s}.enter .grid>*:nth-child(3){animation-delay:.08s}.enter .grid>*:nth-child(4){animation-delay:.12s}.enter .grid>*:nth-child(n+5){animation-delay:.16s}
.ov{animation:fade .2s ease}.ov .sheet{animation:slide .28s cubic-bezier(.2,.8,.2,1)}
button{transition:transform .12s,box-shadow .2s,background .2s}button:active{transform:scale(.97)}
.t{animation:up .25s ease}.card{contain:layout style}
.sec{grid-column:1/-1;font-size:13px;font-weight:700;color:var(--mu);margin:10px 4px -4px}
.wa{display:inline-flex;width:44px;height:44px;border-radius:50%;background:#25D366;align-items:center;justify-content:center;box-shadow:3px 3px 8px var(--sh1)}.wa svg{width:26px;height:26px;fill:#fff;stroke:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script src="vendor/sql-wasm.js" onerror="window.__sqlCdn=1;var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js';document.head.appendChild(s)"></script>
</head>
<body>
<div id="splash"><img src="icon.png" alt="" class="lg"><b>سند</b><p id="spq"></p></div>
<div id="toast"></div>
<div id="view"></div>
<button class="fab raise" id="fab" onclick="document.getElementById('menu').classList.toggle('show')" aria-label="إضافة">+</button>
<div class="menu raise" id="menu">
<button class="pri" onclick="openForm('subject')">📚 إضافة مادة جديدة</button>
<button onclick="openForm('task')">✅ إضافة مهمة عادية</button>
<button onclick="openForm('exam')">📝 إضافة موعد اختبار</button>
</div>
<nav></nav>
<script>
// ===== الجمل التحفيزية: تُولَّد بالتركيب (12 × 30 × 8 = 2880 جملة فريدة) =====
const OP=["","يا بطل، ","تذكّر: ","حكمة اليوم: ","همسة من سند: ","قاعدة ذهبية: ","رسالة لك: ","ببساطة: ","قلها لنفسك: ","لا تنسَ: ","اسمعها مني: ","كن واثقًا: "];
const CO=["النجاح يبدأ بخطوة صغيرة","كل ساعة مذاكرة اليوم تُريحك غدًا","الاجتهاد اليوم هو فخر الغد","التعب مؤقت والإنجاز يبقى","لا أحد يصنع مستقبلك سواك","الانضباط أقوى من الحماس","المثابرة تهزم الموهبة حين تتكاسل","الخطوة المنتظمة أفضل من القفزة المتقطعة","ما تبذله اليوم تحصده في الاختبار","التأجيل لصٌّ يسرق أحلامك","العقل المنظّم يتعلم أكثر في وقت أقل","كل مهمة تنجزها تقرّبك من حلمك","الأحلام الكبيرة تبدأ بجدول صغير","الفشل درس وليس نهاية","من جدّ وجد ومن زرع حصد","الصبر مفتاح كل باب مغلق","ركّز على التقدّم لا على الكمال","الراحة بعد الإنجاز أحلى","وقتك أغلى ما تملك فاستثمره","الثقة بالنفس تُبنى بالإنجاز المتكرر","كل يوم فرصة جديدة لتكون أفضل","المذاكرة المنتظمة تصنع التفوق","أنت أقوى مما تظن","الطريق الصعب يقود إلى القمم","العادات الصغيرة تصنع نتائج كبيرة","لا تقارن نفسك بغيرك بل بما كنت عليه أمس","الهدف الواضح نصف الطريق","ساعة تركيز تساوي ساعات من التشتت","من يتعب اليوم يرتاح غدًا","النجاح عادة وليس صدفة"];
const CL=[""," فاستمر."," وأنت قادر."," ابدأ الآن!"," وسند معك."," لا تتوقف."," والله يعينك."," اجعل اليوم يومك."];
const NQ=OP.length*CO.length*CL.length;
const quote=i=>{i=((i%NQ)+NQ)%NQ;const o=i%OP.length,c=Math.floor(i/OP.length)%CO.length,l=Math.floor(i/(OP.length*CO.length));return OP[o]+CO[c]+(CL[l]||"")+(CL[l]?"":".")};
const STRICT=["التزامك اليوم أقل من نصف المطلوب، قم الآن وأنجز مهمة واحدة على الأقل!","المستقبل لا ينتظر المتكاسلين، عُد إلى جدولك فورًا.","نصف الطريق لا يكفي، أكمل مهامك قبل أن ينتهي اليوم.","كل دقيقة تأجيل تُضاف إلى ضغط الغد، ابدأ الآن بلا أعذار.","أنت تعرف أنك قادر على أكثر من هذا، أثبت ذلك اليوم."];
// ===== الحالة =====
const dflt=()=>({profile:null,subjects:[],tasks:[],exams:[],sessions:[],lects:[],files:[],log:[],settings:{theme:"light",notify:false},flags:{},qi:Math.floor(Math.random()*NQ)});
let S=dflt(),dirH=null,dirOk=true;
const DB=new Promise(r=>{try{const q=indexedDB.open("sanad",1);q.onupgradeneeded=()=>{q.result.createObjectStore("kv");q.result.createObjectStore("files")};q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const idb=(st,m,...a)=>DB.then(d=>new Promise((ok,no)=>{if(!d)return ok();const q=d.transaction(st,m==="get"?"readonly":"readwrite").objectStore(st)[m](...a);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}));
const save=()=>{S.lastSaved=Date.now();idb("kv","put",S,"S").catch(()=>{});syncDir();autoSnap();persistSQL();clearTimeout(rtm);rtm=setTimeout(planReminders,4000)};
async function syncDir(){try{if(!dirH||!dirOk)return;const f=await dirH.getFileHandle("sanad-data.json",{create:true});const w=await f.createWritable();await w.write(JSON.stringify(S));await w.close()}catch(e){}}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>ymd(new Date());
const wkStart=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+1)%7));return x}; // الأسبوع يبدأ السبت
const wk=()=>ymd(wkStart(new Date()));
const dayIdx=()=>Math.floor((new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate())-wkStart(new Date()))/864e5);
const weekEnd=()=>{const x=wkStart(new Date());x.setDate(x.getDate()+6);return ymd(x)};
const fmt=s=>new Date(s).toLocaleString("ar-EG",{weekday:"short",day:"numeric",month:"short",hour:s.length>10?"numeric":undefined,minute:s.length>10?"2-digit":undefined});
let tab=0;
function ensureWeekly(){const k=wk();S.tasks=S.tasks.filter(t=>!t.weekly||t.wk===k);
S.subjects.forEach(s=>{if(!S.tasks.some(t=>t.weekly&&t.sid===s.id))S.tasks.push({id:uid(),title:"مذاكرة "+s.name+" لمرة واحدة على الأقل",due:weekEnd(),done:false,weekly:true,sid:s.id,wk:k})});const W0=+wkStart(new Date());S.tasks.forEach(t=>{if(t.weekly)t.done=S.sessions.some(x=>x.sid===t.sid&&x.at>=W0&&(x.min||25)>=10)})}
// ===== التنبيهات =====
function notify(msg,warn){const b=document.createElement("div");b.className="t raise"+(warn?" w":"");b.textContent=msg;b.onclick=()=>b.remove();document.getElementById("toast").appendChild(b);setTimeout(()=>b.remove(),9000);
try{if(S.settings.notify&&"Notification"in window&&Notification.permission==="granted")new Notification("سند",{body:msg})}catch(e){}}
function stats(){const t=today();const l=S.tasks.filter(x=>!x.weekly&&(x.due===t||(x.due<t&&!x.done)));const d=l.filter(x=>x.done).length;return{l,d,p:l.length?Math.round(d/l.length*100):0}}
function check(){const now=Date.now(),t=today();let ch=false;
S.exams.forEach(e=>{const df=new Date(e.at)-now;if(df<=0)return;
if(df<=864e5&&!e.n1){e.n1=e.n7=true;ch=true;notify("⏰ اختبار «"+e.name+"» بعد أقل من 24 ساعة! راجع الآن.",true)}
else if(df<=7*864e5&&!e.n7){e.n7=true;ch=true;notify("📝 اختبار «"+e.name+"» بعد "+Math.ceil(df/864e5)+" أيام. ابدأ المراجعة الآن.")}});
S.subjects.forEach(s=>{if(dayIdx()<(low(s.id)?3:5))return;const w=S.tasks.find(x=>x.weekly&&x.sid===s.id);const k="w"+s.id+t;if(w&&!w.done&&!S.flags[k]){S.flags[k]=1;ch=true;notify("مستواك في مادة "+s.name+" يحتاج لدعم، متبقي "+(7-dayIdx()===1?"يوم":"يومان")+" على انتهاء الأسبوع ولم تذاكرها بعد!",true)}});
S.subjects.forEach(s=>{const k="r"+s.id+t;if(s.next&&s.next<=now&&!S.flags[k]){S.flags[k]=1;ch=true;notify("🔁 حان موعد مراجعة "+s.name+" لتثبيتها قبل نسيانها.")}});const cu=cushion();if(cu.diff<0&&!S.flags["c"+t]){S.flags["c"+t]=1;ch=true;notify("جدولك هذا الأسبوع فوق طاقتك الزمنية بـ "+(-cu.diff)+" ساعات، رتب أولوياتك!",1)}if(!LN){const hr=new Date().getHours();if(hr>=8&&hr<=22&&Date.now()-(S.flags.lr||0)>=72e5){S.flags.lr=Date.now();ch=true;const tp=rank()[0];notify("📚 وقت المذاكرة: "+(tp?tp.s.name+(tp.r[0]?" — "+tp.r[0]:""):"ابدأ جلسة الآن"))}}if(Date.now()-(S.lastExport||S.created||Date.now())>7*864e5&&!S.flags["b"+t]){S.flags["b"+t]=1;ch=true;notify("💾 مر أسبوع على آخر نسخة احتياطية مصدّرة. صدّر نسخة من الإعدادات.")}const st=stats();if(new Date().getHours()>=16&&st.l.length&&st.p<50&&!S.flags["g"+t]){S.flags["g"+t]=1;ch=true;notify(STRICT[Math.floor(Math.random()*STRICT.length)]+" ("+st.p+"%)",true)}
if(ch){save();render()}}
// ===== الواجهات =====
function go(n){tab=n;render();window.scrollTo(0,0);const v=document.getElementById("view");v.classList.remove("enter");void v.offsetWidth;v.classList.add("enter");setTimeout(()=>v.classList.remove("enter"),700)}
function render(){ensureWeekly();document.documentElement.dataset.theme=S.settings.theme;
[0,1,2,3].forEach(i=>document.getElementById("n"+i).classList.toggle("on",tab===i));
document.getElementById("fab").style.display=tab===2?"block":"none";document.getElementById("menu").classList.remove("show");
const v=document.getElementById("view");if(!S.profile){v.innerHTML=onboard();return}
v.innerHTML=[home,home,addTab,settings][tab]();shape(v);decorate(v);document.body.classList.toggle("pm",panicEx().length>0);if(tab===3){est();bkList()}}
function onboard(){return `<div class="card raise" style="margin-top:40px"><h1>أهلًا بك في سند 👋</h1><p class="mu">أدخل بياناتك مرة واحدة وتُحفظ على جهازك فقط.</p><label>الاسم بالكامل</label><input id="on" placeholder="الاسم"><label>المرحلة الدراسية</label>${stageSel("os")}<button class="pri" style="width:100%" onclick="saveProfile('on','os')">ابدأ</button></div>`}
const STAGES=["ابتدائي","إعدادي","ثانوي","جامعي"];
const stageSel=(id,v)=>`<select id="${id}">${STAGES.map(x=>`<option ${x===v?"selected":""}>${x}</option>`).join("")}</select>`;
function saveProfile(a,b){const n=document.getElementById(a).value.trim();if(!n){notify("اكتب اسمك أولًا",1);return}S.profile={name:n,stage:document.getElementById(b).value};save();render();if(tab===3)notify("تم الحفظ ✔")}
function taskRow(t){const s=S.subjects.find(x=>x.id===t.sid);return `<div class="row ${t.done?"done":""}"><div><b>${esc(t.title)}</b><span class="mu">${t.weekly?"مهمة أسبوعية إجبارية":fmt(t.due)}${t.notes?" · "+esc(t.notes):""}</span></div><button class="chk" onclick="tog('${t.id}')">${t.done?"✔":"○"}</button></div>`}
function tog(id){const t=S.tasks.find(x=>x.id===id);if(t.weekly){notify("تُحتسب المذاكرة الأسبوعية بعد إتمام جلسة تركيز لهذه المادة 🍅",1);return}t.done=!t.done;save();render()}
function home(){const st=stats(),k=wk(),now=Date.now();
const wt=S.tasks.filter(x=>!x.weekly&&x.due>today()&&x.due<=weekEnd());
const ex=S.exams.filter(e=>new Date(e.at)>now).sort((a,b)=>new Date(a.at)-new Date(b.at));
return `<h1><img src="icon.png" alt="" style="height:34px;vertical-align:middle;border-radius:8px;margin-left:8px" onerror="this.remove()">مرحبًا ${esc(S.profile.name)} 🌿</h1>${permBanner()}${quickBar()}${battery()}${panic()}${cushionCard()}${rescue()}${todayAtt()}${tomorrow()}${whatNow()}${pomoCard()}${gradesCard()}${statsCard()}
<div class="card raise"><div class="quote" id="q">${quote(S.qi)}</div><button class="sm" style="margin-top:12px" onclick="S.qi=Math.floor(Math.random()*NQ);save();document.getElementById('q').textContent=quote(S.qi)">جملة جديدة</button> <span class="mu">من ${NQ.toLocaleString("ar-EG")} جملة</span></div>
<div class="card raise"><h2>مهام اليوم</h2><div class="sink bar"><i style="width:${st.p}%"></i></div><div class="mu" style="margin-top:-6px;margin-bottom:8px">تم إنجاز ${st.d} من ${st.l.length} (${st.p}%)</div>${st.l.map(taskRow).join("")||'<p class="mu">لا توجد مهام لليوم 🎉</p>'}</div>
<div class="card raise"><h2>حصاد الأسبوع</h2>

function del(k,id){if(!confirm("تأكيد الحذف؟"))return;S[k]=S[k].filter(x=>x.id!==id);if(k==="subjects")S.tasks=S.tasks.filter(t=>t.sid!==id);save();render()}
function settings(){return `<h1>الإعدادات</h1>
<div class="sec">الملف الشخصي</div><div class="card raise"><h2>الحساب</h2><label>الاسم</label><input id="sn" value="${esc(S.profile.name)}"><label>المرحلة</label>${stageSel("ss",S.profile.stage)}<button class="pri" onclick="saveProfile('sn','ss')">حفظ</button></div>

<div class="card raise"><h2>خيارات المؤقت</h2><p class="mu">اختر مدة المذاكرة/الراحة بالدقائق، أو خصّص وقتك بنفسك.</p>${timerOpts()}</div>
<div class="card raise"><h2>المظهر</h2><button onclick="S.settings.theme=S.settings.theme==='dark'?'light':'dark';save();render()">${S.settings.theme==="dark"?"☀️ الوضع الفاتح":"🌙 الوضع الغامق"}</button></div>

<div class="sec">البيانات والحماية</div><div class="card raise"><h2>التخزين</h2><p class="mu">محرك البيانات: ${DBH?"SQLite ✔ (ملف sanad.sqlite)":"احتياطي IndexedDB (تعذّر تحميل SQLite)"}</p><p class="mu" id="sg">جارٍ الحساب…</p><p class="mu">بياناتك وملفاتك تُحفظ في مخزن التطبيق على جهازك بلا حد ثابت من سند؛ الحد الفعلي يحدده المتصفح ومساحة جهازك الفارغة.</p><button onclick="pickDir()">${dirH?(dirOk?"المجلد مرتبط ✔":"إعادة تفعيل المجلد"):"ربط مجلد خاص بسند"}</button></div>
<div class="card raise"><h2>الحماية والنسخ الاحتياطي</h2><p class="mu">آخر حفظ: ${tt(S.lastSaved)}<br>آخر نسخة تلقائية: ${tt(S.lastBackup)}<br>آخر تصدير: ${tt(S.lastExport)}</p><button class="pri" onclick="backup()">تصدير نسخة كاملة (بيانات وملفات)</button> <button onclick="document.getElementById('imp').click()">استيراد نسخة</button><input type="file" id="imp" accept=".json" style="display:none" onchange="restore(this.files[0])"><p class="mu">لنقل بياناتك بين الهاتف والكمبيوتر: صدّر نسخة هنا ثم استوردها في الجهاز الآخر.</p><b>النسخ التلقائية (آخر 5)</b><div id="bk"></div><br><button onclick="selfTest()">اختبار سلامة البيانات</button> <button onclick="perfTest()">اختبار الأداء</button><div id="tst" class="mu"></div><div id="pf" class="mu"></div><br><button class="sm warn" onclick="if(confirm('سيتم مسح كل البيانات!')){S=dflt();save();render()}">مسح كل البيانات</button></div>
${logCard()}<div class="sec">عن التطبيق</div>${aboutCard()}`}
function askNotif(){if(!("Notification"in window)){notify("جهازك لا يدعم الإشعارات",1);return}Notification.requestPermission().then(p=>{S.settings.notify=p==="granted";save();render()})}
// ===== مزايا جديدة =====
const P={mode:"idle",end:0,sid:null};
const pct=s=>{const g=S.exams.filter(e=>e.sid===s&&e.g!=null);return g.length?g.reduce((a,e)=>a+e.g/e.max*100,0)/g.length:null};
const low=s=>{const p=pct(s);return p!==null&&p<65};
const gp=p=>p>=90?4:p>=85?3.7:p>=80?3.3:p>=75?3:p>=70?2.7:p>=65?2.4:p>=60?2:p>=50?1:0;
const w0=()=>+wkStart(new Date());
const tm=t=>new Date(t).toLocaleTimeString("ar-EG",{hour:"numeric",minute:"2-digit"});
const mmss=l=>String(Math.floor(l/6e4)).padStart(2,"0")+":"+String(Math.floor(l%6e4/1e3)).padStart(2,"0");
const DUR={get focus(){return(S.settings.pf||25)*6e4},get break(){return(S.settings.pb||5)*6e4}};
const LN=(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications)||null;
let rtm=0,AC=null;
const nm=()=>esc((S.subjects.find(x=>x.id===P.sid)||{}).name);
function unlockAudio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}}
function beep(){try{unlockAudio();const t=AC.currentTime;for(let i=0;i<6;i++){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=i%2?880:1175;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.35,t+i*.5);g.gain.setValueAtTime(0,t+i*.5+.4);o.start(t+i*.5);o.stop(t+i*.5+.45)}}catch(e){}}
async function notifInit(){if(!LN)return;try{let p=await LN.checkPermissions();if(p.display!=="granted")p=await LN.requestPermissions();S.flags.np=p.display;await LN.createChannel({id:"timer",name:"المؤقت",importance:5,sound:"done.wav",vibration:true});await LN.createChannel({id:"remind",name:"تذكير المذاكرة",importance:4,vibration:true});save();await planReminders()}catch(e){}}
async function schedEnd(){await cancelEnd();if(!LN)return;try{await LN.schedule({notifications:[{id:1,title:"سند ⏰",body:P.mode==="focus"?"انتهى وقت المذاكرة 🍅":"انتهت الراحة، جاهز لجلسة جديدة؟",channelId:"timer",sound:"done.wav",schedule:{at:new Date(P.end),allowWhileIdle:true}}]})}catch(e){}}
async function cancelEnd(){if(LN)try{await LN.cancel({notifications:[{id:1}]})}catch(e){}}
async function planReminders(){if(!LN)return;try{await LN.cancel({notifications:[10,11,12,13,14,15,16,17].map(id=>({id}))});const l=rank(),H=[8,10,12,14,16,18,20,22];await LN.schedule({notifications:H.map((h,i)=>{const t=l.length?l[i%l.length]:null;return{id:10+i,title:"سند 📚 وقت المذاكرة",body:t?"ذاكر الآن مادة «"+t.s.name+"»"+(t.r[0]?" — "+t.r[0]:""):"افتح سند وابدأ جلسة مذاكرة الآن",channelId:"remind",schedule:{on:{hour:h,minute:0},allowWhileIdle:true}}})})}catch(e){}}
function permBanner(){if(!LN||S.flags.np==="granted")return"";return `<div class="card raise"><b class="warn">⚠ الإشعارات متوقفة</b><p class="mu">تذكير المذاكرة كل ساعتين إجباري ولن يصلك بدونها.</p><button class="pri" onclick="notifInit().then(()=>render())">تفعيل الإشعارات</button><p class="mu">لو لم تظهر نافذة الإذن: إعدادات الهاتف ← التطبيقات ← سند ← الإشعارات.</p></div>`}
function startFocus(){if(!S.subjects.length){notify("أضف مادة أولًا",1);return}if(!P.sid)P.sid=S.subjects[0].id;unlockAudio();P.mode="focus";P.dur=DUR.focus;P.end=Date.now()+P.dur;schedEnd();render()}
const elapsedMs=()=>P.dur-(P.mode==="paused"?P.left:Math.max(0,P.end-Date.now()));
function pauseP(){P.left=Math.max(0,P.end-Date.now());P.prev=P.mode;P.mode="paused";cancelEnd();render()}
function resumeP(){unlockAudio();P.mode=P.prev;P.end=Date.now()+P.left;schedEnd();render()}
function finishP(){const was=P.mode==="paused"?P.prev:P.mode,m=Math.floor(elapsedMs()/6e4);cancelEnd();P.mode="idle";if(was==="focus"){if(m>=1){S.sessions.push({sid:P.sid,at:Date.now(),min:m});save();notify("✅ تم إنهاء الجلسة واحتساب "+m+" دقيقة");rate(P.sid)}else notify("الجلسة أقل من دقيقة ولم تُحتسب",1)}render()}
function tick(){if(P.mode==="idle"||P.mode==="paused")return;const l=P.end-Date.now();if(l<=0){if(P.mode==="focus"){S.sessions.push({sid:P.sid,at:Date.now(),min:Math.round(P.dur/6e4)});save();P.mode="break";P.dur=DUR.break;P.end=Date.now()+P.dur;schedEnd();notify("🍅 انتهى وقت المذاكرة وتم احتساب الجلسة! خذ راحة "+(S.settings.pb||5)+" دقائق.");beep();rate(P.sid)}else{P.mode="idle";notify("انتهت الراحة، جاهز لجلسة جديدة؟");beep()}render();return}const e=document.getElementById("pt");if(e)e.textContent=mmss(l)}
function pomoCard(){const m=P.mode,sel=`<select id="ps" onchange="P.sid=this.value">${S.subjects.map(s=>`<option value="${s.id}" ${s.id===P.sid?"selected":""}>${esc(s.name)}</option>`).join("")}</select>`,t=m==="idle"?mmss(DUR.focus):mmss(m==="paused"?P.left:P.end-Date.now()),lab=m==="focus"?"تركيز على "+nm():m==="break"?"وقت الراحة ☕":"⏸ متوقف مؤقتًا ("+(P.prev==="focus"?nm():"راحة")+")";
const btn=m==="idle"?`<button class="pri" style="width:100%" onclick="startFocus()">ابدأ ${S.settings.pf||25} دقيقة</button>`:`<div style="display:flex;gap:8px">${m==="paused"?`<button class="pri" style="flex:1" onclick="resumeP()">▶ استئناف</button>`:`<button style="flex:1" onclick="pauseP()">⏸ إيقاف مؤقت</button>`}<button style="flex:1" onclick="finishP()">■ إنهاء الجلسة</button></div>`;
return `<div class="card raise"><h2>🍅 مؤقت التركيز</h2>${m==="idle"?sel+timerOpts():`<p class="mu" style="text-align:center">${lab}</p>`}<div class="pt" id="pt">${t}</div>${btn}</div>`}
function score(){const st=stats(),n=S.subjects.length;const sd=n?S.subjects.reduce((a,s)=>a+(S.sessions.some(x=>x.sid===s.id&&x.at>=w0())?100:Math.max(0,100-dayIdx()*17)),0)/n:100;const od=S.tasks.filter(t=>!t.weekly&&!t.done&&t.due<today()).length;return Math.round(Math.max(0,.5*sd+.5*(st.l.length?st.p:100)-8*od))}
function battery(){const c=score(),col=c>=70?"var(--ac)":c>=40?"#6f8f88":"#8a8a8a";return `<div class="card raise"><h2>معدل الأمان الدراسي</h2><div class="sink bat"><i style="width:${Math.max(c,4)}%;background:${col}"></i></div><b style="font-size:22px">${c}%</b> <span class="mu">${c>=70?"وضعك آمن":c>=40?"انتبه، الشحن يقل":"تحتاج لشحن عاجل"}</span></div>`}
function rank(){const now=Date.now(),W=w0();return S.subjects.map(s=>{let sc=0,r=[];const ex=S.exams.filter(e=>e.sid===s.id&&new Date(e.at)>now).sort((a,b)=>new Date(a.at)-new Date(b.at))[0];
if(ex){const d=Math.ceil((new Date(ex.at)-now)/864e5);sc+=Math.max(0,60-d*4);r.push("اختبار "+ex.name+" بعد "+d+" يوم")}
const p=pct(s.id);if(p!==null&&p<75){sc+=75-p;r.push("درجتك "+Math.round(p)+"%")}
const m=S.lects.filter(l=>l.sid===s.id&&l.missed).length;if(m){sc+=m*8;r.push(m+" محاضرة فائتة")}
if(!S.sessions.some(x=>x.sid===s.id&&x.at>=W)){sc+=25;r.push("لم تذاكرها هذا الأسبوع")}
if(s.next&&s.next<=now){sc+=40;r.push("موعد مراجعتك المتباعدة")}return{s,sc,r}}).sort((a,b)=>b.sc-a.sc)}
function whatNow(){const l=rank();if(!l.length)return"";const t=l[0];return `<div class="card raise"><h2>اذاكر إيه الآن؟</h2><b style="font-size:19px">${esc(t.s.name)}</b><p class="mu">${t.r.join(" · ")||"كل شيء مستقر، راجع ما تعلمته"}</p><button class="pri" onclick="P.sid='${t.s.id}';startFocus()">ابدأ جلسة تركيز</button>${l.slice(1,3).map(x=>`<div class="row"><span>${esc(x.s.name)}</span><span class="mu">${x.r[0]||""}</span></div>`).join("")}</div>`}
function gradesCard(){const now=Date.now(),pend=S.exams.filter(e=>new Date(e.at)<now&&e.g==null),rows=S.subjects.map(s=>({s,p:pct(s.id)})).filter(x=>x.p!==null),gpa=rows.length?rows.reduce((a,x)=>a+gp(x.p),0)/rows.length:null;if(!pend.length&&!rows.length)return"";
return `<div class="card raise"><h2>درجاتي</h2>${pend.map(e=>`<div class="row"><div><b>${esc(e.name)}</b><span class="mu">أدخل درجتك من / العظمى</span></div><div style="display:flex;gap:6px;width:58%"><input id="g${e.id}" type="number" placeholder="درجتك" style="margin:0"><input id="m${e.id}" type="number" value="100" style="margin:0"><button class="sm pri" onclick="saveG('${e.id}')">حفظ</button></div></div>`).join("")}${rows.map(x=>`<div class="row"><span>${esc(x.s.name)}</span><b class="${x.p<65?"warn":""}">${Math.round(x.p)}%</b></div>`).join("")}${gpa!==null?`<p><b>التقدير المتوقع (GPA): ${gpa.toFixed(2)} / 4</b></p>`:""}</div>`}
function saveG(id){const e=S.exams.find(x=>x.id===id),g=parseFloat(document.getElementById("g"+id).value),m=parseFloat(document.getElementById("m"+id).value)||100;if(isNaN(g)||g<0||g>m){notify("درجة غير صحيحة",1);return}e.g=g;e.max=m;save();render()}
const panicEx=()=>S.exams.filter(e=>{const d=new Date(e.at)-Date.now();return d>0&&d<=48*36e5}).sort((a,b)=>new Date(a.at)-new Date(b.at));
function panic(){return panicEx().map(e=>{const s=S.subjects.find(x=>x.id===e.sid)||{name:""},fl=S.files.filter(f=>f.sid===e.sid),ms=S.lects.filter(l=>l.sid===e.sid&&l.missed);
let t=Date.now(),end=new Date(e.at)-36e5,b=[],st=true;while(t<end&&b.length<8){const to=Math.min(t+(st?120:30)*6e4,end);b.push((st?"📖 مذاكرة ":"☕ راحة ")+tm(t)+" – "+tm(to));t=to;st=!st}
return `<div class="panic"><h2>🚨 وضع الطوارئ: ${esc(e.name)} (${esc(s.name)})</h2><p class="mu">يبدأ ${fmt(e.at)} — تبقّى ${Math.floor((new Date(e.at)-Date.now())/36e5)} ساعة</p><b>الملفات الأساسية</b>${fl.map(f=>`<div class="row"><span>${esc(f.name)}</span><button class="sm" onclick="openFile('${f.id}')">فتح</button></div>`).join("")||'<p class="mu">لا ملفات، أضفها من الإدخال ← ملفات.</p>'}<b>المحاضرات الفائتة</b>${ms.map(l=>`<div class="row"><span>${esc(l.title)}</span><button class="sm" onclick="togL('${l.id}')">تمت</button></div>`).join("")||'<p class="mu">لا محاضرات فائتة مسجلة.</p>'}<b>جدول مكثف (ساعتان مذاكرة / نصف ساعة راحة)</b>${b.map(x=>`<div class="row"><span>${x}</span></div>`).join("")}</div>`}).join("")}
async function addFiles(sid,list){for(const f of Array.from(list)){const id=uid();await idb("files","put",f,id);S.files.push({id,sid,name:f.name,size:f.size});if(dirH&&dirOk){try{const d=await dirH.getDirectoryHandle("files",{create:true}),h=await d.getFileHandle(id+"-"+f.name,{create:true}),w=await h.createWritable();await w.write(f);await w.close()}catch(e){}}}save();openMat(sid)}
async function openFile(id){let b=await idb("files","get",id);if(!b&&dirH&&dirOk){try{const f=S.files.find(x=>x.id===id),d=await dirH.getDirectoryHandle("files"),g=await d.getFileHandle(id+"-"+f.name);b=await g.getFile()}catch(e){}}if(b)window.open(URL.createObjectURL(b),"_blank")}
async function delFile(id,sid){await idb("files","delete",id);S.files=S.files.filter(f=>f.id!==id);save();openMat(sid)}
function togL(id){const l=S.lects.find(x=>x.id===id);l.missed=!l.missed;save();render()}
function est(){const e=document.getElementById("sg");if(!e)return;if(!(navigator.storage&&navigator.storage.estimate)){e.textContent="";return}navigator.storage.estimate().then(x=>{e.textContent="المستخدم "+(x.usage/1048576).toFixed(1)+" MB من ~"+(x.quota/1073741824).toFixed(1)+" GB متاحة"})}
async function putDir(id,name,b){const d=await dirH.getDirectoryHandle("files",{create:true}),g=await d.getFileHandle(id+"-"+name,{create:true}),w=await g.createWritable();await w.write(b);await w.close()}
async function pickDir(){if(NAT){notify("مجلد Sanad مربوط تلقائيًا ✔");return}if(!window.showDirectoryPicker){notify("اختيار مجلد حقيقي متاح حاليًا في كروم/إيدج على الكمبيوتر فقط. على الهاتف تُحفظ بياناتك في مخزن التطبيق، وللحصول على مجلد مستقل بالكامل يلزم تغليف سند كتطبيق أندرويد.",1);return}
